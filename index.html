<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Financeiro Pessoal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                linear-gradient(135deg, #edf2f7, #dbe7f3);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            color: #1f2937;
        }

        .novas-transacoes {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .formulario {
            width: 100%;
            max-width: 560px;

            background: white;

            padding: 40px;

            border-radius: 28px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.08);
        }

        .transacoes {
            display: flex;
            flex-direction: column;

            gap: 18px;
        }

        .transacoes h2 {
            text-align: center;

            font-size: 34px;
            font-weight: bold;

            margin-bottom: 10px;

            color: #111827;
        }

        .transacoes label {
            font-size: 15px;
            font-weight: bold;

            color: #4b5563;
        }

        .transacoes input,
        .transacoes select {
            width: 100%;

            padding: 14px 16px;

            border-radius: 14px;
            border: 1px solid #d1d5db;

            background: #f9fafb;

            outline: none;

            font-size: 16px;

            transition: 0.3s;
        }

        .transacoes input:focus,
        .transacoes select:focus {
            border-color: #4a90e2;

            background: white;

            box-shadow:
                0 0 0 4px rgba(74, 144, 226, 0.15);
        }

        /* Botões Entrada/Saída */

        .btn-entrada-saida {
            display: flex;
            flex-direction: column;

            gap: 12px;

            margin-top: 5px;
        }

        .btn-entrada-saida button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 14px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .entrada {
            background: #22c55e;
            color: white;
        }

        .entrada:hover {
            background: #16a34a;

            transform: translateY(-2px);
        }

        .saida {
            background: #ef4444;
            color: white;
        }

        .saida:hover {
            background: #dc2626;

            transform: translateY(-2px);
        }

        /* Data */

        .data {
            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        /* Categoria */

        .categoria-entrada, .categoria-saida {
            display: none;
        }

        .categoria-entrada.ativo,
        .categoria-saida.ativo {
            display: block;
        }

        /* Botões finais */

        .btn-enviar-transacao {
            display: flex;

            gap: 15px;

            margin-top: 15px;
        }

        .btn-enviar-transacao button {
            flex: 1;

            padding: 15px;

            border: none;
            border-radius: 14px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        #cancelar {
            background: #e5e7eb;
            color: #374151;
        }

        #cancelar:hover {
            background: #d1d5db;

            transform: translateY(-2px);
        }

        #salvar {
            background: #4a90e2;
            color: white;
        }

        #salvar:hover {
            background: #357abd;

            transform: translateY(-2px);
        }

        /* Responsividade */

        @media (max-width: 768px) {

            body {
                padding: 20px;
            }

            .formulario {
                padding: 25px;
            }

            .transacoes h2 {
                font-size: 28px;
            }

            .btn-enviar-transacao {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="novas-transacoes">
        <div class="formulario">
            <form class="transacoes">
                <h2>Nova Transação</h2>
                <label for="descricao">Descrição</label>
                <input type="text" name="descricao" required>
                <label for="Valor">Valor</label>
                <input type="number" name="valor" required>

                <label for="categoria">Categoria</label>
                <select name="categoriaEntrada" class="categoria-entrada ativo"> <!-- Entrada -->
                    <option value="selecionar" selected disabled>Selecione uma categoria</option>
                    <option value="salario">💰 Salário</option>
                    <option value="freelance">💻 Freelance</option>
                    <option value="venda">🛒 Venda</option>
                    <option value="outros">📦 Outros</option>
                </select>

                <select name="categoria-saida" class="categoria-saida" required>
                    <option value="selecionar" selected disabled>Selecione uma categoria</option>
                    <option value="alimentacao">🍔 Alimentação</option>
                    <option value="transporte">🚗 Transporte</option>
                    <option value="moradia">🏠 Moradia</option>
                    <option value="saude">❤️ Saúde</option>
                    <option value="educacao">📚 Educação</option>
                    <option value="lazer">🎮 Lazer</option>
                    <option value="compras">🛍️ Compras</option>
                    <option value="outros">📦 Outros</option>
                </select>

                <div class="btn-entrada-saida">
                    <label for="tipo">Tipo</label>
                    <button name="entrada" type="button" class="entrada">⬆ Entrada</button>
                    <button name="saida" type="button" class="saida">⬇ Saida</button>
                </div>

                <div class="data">
                    <label for="data">Data</label>
                    <input type="date" name="dataAtual" id="data-atual">
                </div>

                <div class="btn-enviar-transacao">
                    <button id="cancelar" type="reset">Cancelar</button>
                    <button id="salvar" type="submit">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const transacoes = document.querySelector(".transacoes");
        const listaDeDados = [];

        const btnSaida = document.querySelector(".saida");
        const categoriaSaida = document.querySelector(".categoria-saida");

        const btnEntrada = document.querySelector(".entrada");
        const categoriaEntrada = document.querySelector(".categoria-entrada");

        let tipoSelecionado = "entrada";

        btnSaida.addEventListener("click", event => {
            tipoSelecionado = "saida";
            btnSaida.classList.toggle("ativo");
            categoriaEntrada.classList.remove("ativo")
            categoriaSaida.classList.add("ativo");
        })

        btnEntrada.addEventListener("click", event => {
            tipoSelecionado = "entrada";
            btnEntrada.classList.toggle("ativo");
            categoriaSaida.classList.remove("ativo");
            categoriaEntrada.classList.add("ativo")
        })


        transacoes.addEventListener("submit", event => {
            event.preventDefault();

            const novoValor = {
                descricao: event.target.descricao.value,
                valor: event.target.valor.value,
                escolha: tipoSelecionado,
                data: event.target.dataAtual.value || new Date().toISOString().split("T")[0]
            }
            listaDeDados.push(novoValor);
            salvarLocalStorage(listaDeDados);
            transacoes.reset();

            console.log(listaDeDados)
        })

        function salvarLocalStorage(parametro){
            return localStorage.setItem("listaTransacoes", JSON.stringify(parametro));
        }

    </script>
</body>

</html>
