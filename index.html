<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="aside">

        <div class="logo">
            <div class="img">
                <p>$</p>
            </div>
            <div class="texto">
                <h2>Financeiro</h2>
                <p>Pessoal</p>
            </div>
        </div>

        <div class="cards">
            <nav class="nav-cards">
                <a href="#">📊 Dashboard</a>
                <a href="#">💸 Transações</a>
                <a href="#">📈 Relatórios</a>
                <a href="#">📄 Exportar CSV</a>
            </nav>
        </div>

        <div class="cardTotais">
            <h2>Exibir cards</h2>
        </div>
    </div>

    <div class="conteudo-principal">
        <div class="container-topo">
            <header>
                <div class="menu">
                    <h2>Dashboard</h2>
                    <p>Visão geral da sua vida financeira</p>
                </div>
                <div class="navTopo">
                    <nav class="nav-bar">
                        <a href="#" id="me-ano">Mês/Ano</a>

                    </nav>
                </div>
            </header>
        </div>


        <div class="cards-principais">
            <div class="card-totais">
                <a href="">
                    <div class="imgReceita">💰</div>
                    <div class="cardsA">
                        <p>Receita</p>
                        <div id="receitas"></div>
                    </div>
                </a>

                <a href="">
                    <div class="imgDespesa">💸</div>
                    <div class="cardsA">
                        <p>Despesa</p>
                        <div id="despesas"></div>
                    </div>
                </a>
                <a href="">
                    <div class="imgSaldo">⚖️</div>
                    <div class="cardsA">
                        <p>Saldo</p>
                        <div id="saldo"></div>
                    </div>
                </a>
                <a href="">
                    <div class="imgGeral">📊</div>
                    <div class="cardsA">
                        <p>Total Geral</p>
                        <div id="geral"></div>
                    </div>
                </a>
            </div>

            <div class="cards-graficos">
                <div class="card-evolucao">
                    <h2>Grafico da evolução</h2>
                    <canvas id="evolucao"></canvas>
                </div>

                <div class="card-despesasCategoria">
                    <h2>Grafico de Despesas</h2>
                    <div class="grafico">
                        <canvas id="grafico"></canvas>
                        <div class="legendas"></div>
                    </div>
                </div>
            </div>

            <div class="ultimas-transacoes"></div>
        </div>
    </div>


    <script type="module" src="modules/modulo-transacao/js/app.js"></script>
    <script type="module" src="modules/modulo-exibirTabela/js/app.js"></script>
    <script type="module" src="modules/modulo-cardsGraficos/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>

</html>
