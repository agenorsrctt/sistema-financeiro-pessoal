<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimas Transacoes</title>
</head>

<body>
    <div class="container">
        <div class="container-tabela">
            <h2>Ultima Transacoes</h2>
            <table border="1" class="tabela"></table>
        </div>
    </div>


    <script>
        const tabela = document.querySelector(".tabela");

        function carregarLocalStorage() {
            const getLista = localStorage.getItem("listaTransacoes")
            if (getLista) {
                return JSON.parse(getLista);
            } else {
                return [];
            }
        }

        const listaAtualizada = carregarLocalStorage();

        tabela.innerHTML = "";

        const th = document.createElement("tr");

            th.innerHTML = `
                <th>Descrição</th>
                <th>Categoria</th>
                <th>Tipo</th>
                <th>Data</th>
                <th>Valor</th>
                <th>Ações</th>
            `;

        tabela.appendChild(th);
        listaAtualizada.forEach(lista => {
            
            const td = document.createElement("tr");

            td.innerHTML = `
                <td>${lista.descricao}</td>
                <td>${lista.categoria}</td>
                <td>${lista.escolha}</td>
                <td>${lista.data}</td>
                <td>${lista.valor}</td>
            `

            console.log(tabela)
            tabela.appendChild(td);
        })
    </script>
</body>

</html>
